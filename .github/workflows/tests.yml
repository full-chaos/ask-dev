name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Pins CHAOS-4509: a failing tier must make `run_checks.sh ci` exit
    # non-zero and stop at the first failure. Pure bash, no toolchain needed.
    run-checks-selftest:
        name: run_checks.sh self-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash ci/run_checks_fail_fast.test.sh

    # Every job runs the SAME entry point a developer runs locally
    # (ci/run_checks.sh <tier>), so a green local run means a green CI run.
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_checks.sh format
            # Exact-diff regeneration guard. Needs no acr checkout: it verifies
            # the committed copies against the manifest digests and regenerates
            # the types from them.
            - run: bash ci/run_checks.sh contracts
            - run: bash ci/run_checks.sh lint
            - run: bash ci/run_checks.sh typecheck

    # Runner-routing contract v1.6. Repo variable SELF_HOSTED_RUNNERS gates
    # which of the two jobs below runs; both carry the same `name: Unit
    # tests` so the check reported to a PR is stable across the flip. The
    # `if:` pair is an exact complement (never both true, never both
    # false), so exactly one leg runs on every workflow run, including fork
    # PRs, which always fall back to hosted regardless of the switch. No
    # poller: same-workflow jobs read each other's result via `needs`
    # directly, so there is nothing to wait on or claim.
    unit-hosted:
        name: Unit tests
        runs-on: ubuntu-latest
        if: >-
            vars.SELF_HOSTED_RUNNERS != 'enabled'
            || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name != github.repository)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_checks.sh unit

    # The self-hosted leg. Same acceptance bar as the pilot that shipped
    # this job (host-only, no docker/browser install, >=1 minute on
    # hosted): measured wall time on the pool is 37s end-to-end (setup-node
    # 5s, corepack 1s, cold `pnpm install` 7s, `run_checks.sh unit` 16s), so
    # 10 minutes leaves ample headroom over the pool's observed variance.
    unit-self-hosted:
        name: Unit tests
        runs-on: [self-hosted, oci-arc-runners]
        if: >-
            vars.SELF_HOSTED_RUNNERS == 'enabled'
            && (github.event_name != 'pull_request'
            || github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        steps:
            # actions/checkout v7.0.1 -- the same pin the hosted leg uses. On
            # a pull request this checks out the merge ref, exactly as the
            # hosted leg does, so both legs test the identical tree.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            # A mislabeled or reassigned runner would make this job's result
            # mean something other than what it claims. The pool is
            # arm64-only by construction (OCI Ampere), so anything else is a
            # misconfiguration to fail loudly on, not to quietly validate the
            # wrong architecture.
            - name: Confirm this runner is actually arm64
              run: |
                  set -euo pipefail
                  uname -m
                  arch="$(uname -m)"
                  if [ "${arch}" != "arm64" ] && [ "${arch}" != "aarch64" ]; then
                    echo "expected an arm64 runner on oci-arc-runners, got '${arch}'" >&2
                    exit 1
                  fi

            # The pool image has no node preinstalled (contract's declared
            # toolset). actions/setup-node downloads a Node binary directly
            # rather than relying on an OS package manager, so it works
            # regardless of what the image ships. Same pin the hosted leg
            # uses.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            # pnpm via corepack (bundled with the node setup-node just
            # installed) rather than pnpm/action-setup's own standalone
            # installer -- corepack ships with node itself, so it carries no
            # separate network/arch dependency to prove out on this pool.
            # Version pinned to package.json's own `packageManager` field so
            # this can never silently drift from what the hosted leg
            # installs.
            - name: Enable corepack and activate the repo's pinned pnpm
              run: |
                  set -euo pipefail
                  corepack enable
                  pnpm_version="$(node -p "require('./package.json').packageManager" | sed -E 's/^pnpm@//')"
                  corepack prepare "pnpm@${pnpm_version}" --activate

            # Cold-store install time on an ephemeral runner: every pool pod
            # is freshly provisioned, so there is no persistent pnpm store to
            # warm -- unlike the hosted leg's actions/setup-node cache: pnpm,
            # which this leg deliberately does not use, since a cache keyed
            # to a pool that discards its filesystem after one job buys
            # nothing.
            - name: Install dependencies (cold store)
              run: |
                  set -euo pipefail
                  start="$(date +%s)"
                  pnpm install --frozen-lockfile
                  printf 'pnpm install --frozen-lockfile: %ss (cold store)\n' "$(( $(date +%s) - start ))"

            # The real work: the SAME `bash ci/run_checks.sh unit` invocation
            # the hosted leg runs -- deliberately the shared entry point
            # rather than a bare `pnpm test:unit`, so the two legs cannot
            # drift apart on flags or environment (run_checks.sh owns
            # TZ/LANG/NODE_ENV).
            - name: Run unit tests on arm64
              run: bash ci/run_checks.sh unit

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_checks.sh build

    e2e:
        name: E2E smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `e2e` builds first when dist/ is absent, then serves the built
            # artifact through `vite preview` — so the smoke suite exercises
            # what a deploy would ship, not the dev server.
            - run: bash ci/run_checks.sh e2e
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 30

    # One stable required status check, so branch protection has a single name
    # to require no matter how the jobs above are split later.
    test:
        name: test
        needs: [run-checks-selftest, quality, unit-hosted, unit-self-hosted, build, e2e]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check every stage
              run: |
                  if [[ "${{ needs.run-checks-selftest.result }}" != 'success' \
                     || "${{ needs.quality.result }}" != 'success' \
                     || "${{ needs.build.result }}" != 'success' \
                     || "${{ needs.e2e.result }}" != 'success' ]]; then
                    exit 1
                  fi
                  # Runner-routing contract v1.6: unit-hosted and
                  # unit-self-hosted carry mutually exclusive, exhaustive
                  # `if:` gates, so exactly one of the two runs `unit` tests
                  # and the other is `skipped`. Require the one that ran to
                  # have succeeded, and guard against both ever being
                  # skipped (which would mean unit tests never ran at all).
                  unit_hosted="${{ needs.unit-hosted.result }}"
                  unit_self_hosted="${{ needs.unit-self-hosted.result }}"
                  if [[ "$unit_hosted" != 'success' && "$unit_hosted" != 'skipped' ]]; then
                    echo "unit-hosted: ${unit_hosted}" >&2
                    exit 1
                  fi
                  if [[ "$unit_self_hosted" != 'success' && "$unit_self_hosted" != 'skipped' ]]; then
                    echo "unit-self-hosted: ${unit_self_hosted}" >&2
                    exit 1
                  fi
                  if [[ "$unit_hosted" == 'skipped' && "$unit_self_hosted" == 'skipped' ]]; then
                    echo "neither unit-hosted nor unit-self-hosted ran" >&2
                    exit 1
                  fi
