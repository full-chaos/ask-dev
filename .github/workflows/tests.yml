name: Tests

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Pins CHAOS-4509: a failing tier must make `run_checks.sh ci` exit
    # non-zero and stop at the first failure. Pure bash, no toolchain needed.
    run-checks-selftest:
        name: run_checks.sh self-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash ci/run_checks_fail_fast.test.sh

    # Every job runs the SAME entry point a developer runs locally
    # (ci/run_checks.sh <tier>), so a green local run means a green CI run.
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_checks.sh format
            # Exact-diff regeneration guard. Needs no acr checkout: it verifies
            # the committed copies against the manifest digests and regenerates
            # the types from them.
            - run: bash ci/run_checks.sh contracts
            - run: bash ci/run_checks.sh lint
            - run: bash ci/run_checks.sh typecheck

    # Runner-routing contract v1.5.1 pilot (CHAOS-4904, second repo). Behind
    # the repo variable SELF_HOSTED_RUNNERS (unset == off, the fail-safe
    # default): the wait step below is skipped outright, no API call is
    # made, and this job runs precisely as it always has. Mirrors
    # dev-health-acr's race-devhealthschema job byte-for-byte in shape; see
    # .github/workflows/ci-self-hosted.yml for the attempt leg this polls.
    #
    # When the switch IS on, the wait step polls the sibling run
    # (scripts/ci/self-hosted-attempt.sh holds the logic) and reports one of
    # three outcomes:
    #   unclaimed        the attempt never left the queue inside the 5-minute
    #                    bound -- this leg does the work itself, so a dead or
    #                    saturated self-hosted pool costs latency, never a red
    #                    build.
    #   claimed-success  the attempt passed; this leg skips its own work and
    #                    reports that success.
    #   claimed-failure  the attempt actually ran and did not pass; this leg
    #                    FAILS -- an attempt that ran and failed found
    #                    something, and re-running it on a hosted runner would
    #                    mask exactly the arm64 behaviour this routing exists
    #                    to learn about. Only a never-started attempt is taken
    #                    over.
    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        # Narrower than the workflow default (contents only): this job pulls
        # no packages, and needs `actions: read` only to see the sibling
        # run's job list.
        permissions:
            contents: read
            actions: read
        steps:
            # Unconditional, and FIRST, because the wait step below runs
            # scripts/ci/self-hosted-attempt.sh out of this workspace --
            # gating the checkout on the outcome of a step that needs the
            # checkout is a cycle. It costs a few seconds on the path where
            # the self-hosted attempt already did the work, which is the
            # cheapest part of this job by a wide margin.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Contract v1.5.1's two gates, identical to the sibling
            # workflow's: the variable must be the literal string `enabled`,
            # and fork pull requests never reach self-hosted capacity.
            # Skipping this step (rather than branching inside it) is what
            # makes the switch-off path cost nothing at all -- no token use,
            # no API call, no added wall-clock.
            - name: Wait for the self-hosted attempt, or claim the work here
              id: wait
              if: >-
                  vars.SELF_HOSTED_RUNNERS == 'enabled'
                  && (github.event_name != 'pull_request'
                  || github.event.pull_request.head.repo.full_name == github.repository)
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  # The PR head SHA on a pull request, the pushed SHA
                  # otherwise -- always the full 40 characters, which the
                  # script re-validates before it queries.
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.head_ref || github.ref_name }}
                  WORKFLOW_NAME: ci-self-hosted
                  WORKFLOW_PATH: .github/workflows/ci-self-hosted.yml
                  JOB_NAME: unit-self-hosted
                  QUEUE_TIMEOUT_MINUTES: 5
                  # Kept in sync by hand with the attempt job's own
                  # timeout-minutes in ci-self-hosted.yml; the script allows
                  # this plus three minutes of reporting lag before calling a
                  # started-but-unfinished attempt a failure.
                  ATTEMPT_TIMEOUT_MINUTES: 10
              run: scripts/ci/self-hosted-attempt.sh wait
            # An empty outcome means the step above was skipped -- switch
            # off, or a fork PR -- which is the same instruction as
            # `unclaimed`: do the work.
            - name: Decide whether this leg owns the real work
              id: own
              env:
                  OUTCOME: ${{ steps.wait.outputs.outcome }}
              run: |
                  set -euo pipefail
                  if [ -z "${OUTCOME}" ] || [ "${OUTCOME}" = unclaimed ]; then
                    echo "run_here=true" >>"$GITHUB_OUTPUT"
                  else
                    echo "run_here=false" >>"$GITHUB_OUTPUT"
                    printf 'self-hosted attempt reached a terminal state (%s); not repeating its work here\n' "${OUTCOME}"
                  fi
            - name: Fail this leg if the self-hosted attempt itself failed
              if: steps.own.outputs.run_here == 'false' && steps.wait.outputs.outcome == 'claimed-failure'
              run: |
                  echo "the self-hosted attempt (unit-self-hosted in the ci-self-hosted workflow) did not succeed; failing this leg so the required gate reflects it" >&2
                  exit 1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              if: steps.own.outputs.run_here == 'true'
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              if: steps.own.outputs.run_here == 'true'
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              if: steps.own.outputs.run_here == 'true'
            - run: bash ci/run_checks.sh unit
              if: steps.own.outputs.run_here == 'true'

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: bash ci/run_checks.sh build

    e2e:
        name: E2E smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `e2e` builds first when dist/ is absent, then serves the built
            # artifact through `vite preview` — so the smoke suite exercises
            # what a deploy would ship, not the dev server.
            - run: bash ci/run_checks.sh e2e
            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: test-results/playwright-html/
                  if-no-files-found: warn
                  retention-days: 30

    # One stable required status check, so branch protection has a single name
    # to require no matter how the jobs above are split later.
    test:
        name: test
        needs: [run-checks-selftest, quality, unit, build, e2e]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check every stage
              run: |
                  if [[ "${{ needs.run-checks-selftest.result }}" != 'success' \
                     || "${{ needs.quality.result }}" != 'success' \
                     || "${{ needs.unit.result }}" != 'success' \
                     || "${{ needs.build.result }}" != 'success' \
                     || "${{ needs.e2e.result }}" != 'success' ]]; then
                    exit 1
                  fi
