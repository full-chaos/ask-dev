---
# The self-hosted ATTEMPT leg of Runner-routing contract v1.5.1.
#
# Mirrors full-chaos/dev-health-acr's ci-self-hosted.yml (merged, PR #399/#402)
# byte-for-byte in shape. Why this is a separate workflow rather than a
# sibling job inside tests.yml: tests.yml's `test` job is the single stable
# required-check name, it `needs` EVERY other job in that file, and it
# rejects any result that is not `success` via an explicit check on each
# job's `.result`. An attempt job gated on the kill switch resolves `skipped`
# while the switch is off, which would turn that check red on every run.
# Putting the attempt here instead leaves tests.yml's job graph identical in
# name and count with the switch off or on, and leaves `test` untouched.
#
# What that costs, stated plainly: the hosted leg in tests.yml cannot poll
# `runs/{GITHUB_RUN_ID}/jobs`, because this attempt is in a different run. It
# resolves this run by full 40-character head SHA + workflow name + workflow
# path + event + ref -- see scripts/ci/self-hosted-attempt.sh, which
# implements and tests that lookup (copied verbatim from acr; the logic is
# repo-agnostic).
#
# The check this workflow registers on a pull request is the job name below,
# suffixed `-self-hosted`. It is deliberately NOT named after the `unit` job
# in tests.yml: nothing here should ever be mistaken for a required context,
# and the required gate remains tests.yml's `test` alone.
name: ci-self-hosted

"on":
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

# A group of its own, so this workflow can neither cancel nor be cancelled by
# tests.yml's own concurrency group. The two runs are independent: a new push
# cancels this run and tests.yml's run separately, each by its own group,
# which is what keeps a superseded attempt from holding an ephemeral ARC
# runner while its replacement queues behind it.
concurrency:
    group: ci-self-hosted-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # The attempt for tests.yml's `unit` job.
    #
    # This job is the pilot for ask-dev's leg of the routing because it is the
    # ONE host-only tests.yml job that clears the acceptance bar: it starts no
    # containers, needs no browser install, and is measured >= 1 minute on
    # hosted (58-63s across four recent runs), unlike `quality` (46-49s) or
    # `build` (30-33s). `e2e` is excluded outright -- it installs and drives a
    # Playwright browser, which is exactly the container/browser risk this
    # pilot is scoped to avoid, same reasoning acr used to exclude its own
    # container-backed jobs from the first pilot.
    #
    # `if:` carries contract v1's two gates: the repository variable must be
    # the literal string `enabled` (unset, or anything else, is OFF -- the
    # fail-safe default), and fork pull requests are excluded regardless of the
    # switch, so self-hosted capacity is never reachable from an untrusted
    # fork's workflow run.
    unit-self-hosted:
        if: >-
            vars.SELF_HOSTED_RUNNERS == 'enabled'
            && (github.event_name != 'pull_request'
            || github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: [self-hosted, oci-arc-runners]
        # Kept in sync by hand with ATTEMPT_TIMEOUT_MINUTES in tests.yml's hosted
        # leg (workflow YAML has no cross-workflow expression for it); the hosted
        # leg allows this plus a three-minute reporting-lag buffer before it
        # calls a started-but-never-finished attempt a failure.
        timeout-minutes: 10
        steps:
            # actions/checkout v7.0.1 -- the same pin tests.yml uses. On a pull
            # request this checks out the merge ref, exactly as tests.yml's own
            # jobs do, so both legs test the identical tree.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }

            # A mislabeled or reassigned runner would make this job's result mean
            # something other than what it claims. The pool is arm64-only by
            # construction (OCI Ampere), so anything else is a misconfiguration to
            # fail loudly on, not to quietly validate the wrong architecture.
            - name: Confirm this runner is actually arm64
              run: |
                  set -euo pipefail
                  uname -m
                  arch="$(uname -m)"
                  if [ "${arch}" != "arm64" ] && [ "${arch}" != "aarch64" ]; then
                    echo "expected an arm64 runner on oci-arc-runners, got '${arch}'" >&2
                    exit 1
                  fi

            # The pool image has no node (bigboy-lane-recipe.md §10a / contract
            # v1.5.1's declared toolset: present git/jq/curl/docker, absent
            # make/node/psql). actions/setup-node downloads a Node binary directly
            # rather than relying on an OS package manager, so it works regardless
            # of what the image ships. Same pin tests.yml's own jobs use.
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc

            # pnpm via corepack (bundled with the node setup-node just installed)
            # rather than pnpm/action-setup's own standalone installer -- corepack
            # ships with node itself, so it carries no separate network/arch
            # dependency to prove out on a pool this pilot has not yet exercised.
            # Version pinned to package.json's own `packageManager` field so this
            # can never silently drift from what tests.yml's jobs install.
            - name: Enable corepack and activate the repo's pinned pnpm
              run: |
                  set -euo pipefail
                  corepack enable
                  pnpm_version="$(node -p "require('./package.json').packageManager" | sed -E 's/^pnpm@//')"
                  corepack prepare "pnpm@${pnpm_version}" --activate

            # Deliberately NON-FAILING, and deliberately not acted on -- same
            # reasoning as acr's tier-2 probe. A missing tool here must not sink
            # the pilot; the pilot is proving the ROUTING. This gathers the
            # evidence a later PR's scope decision needs, including proving the
            # node+corepack toolchain actually works on THIS pool rather than
            # merely on the hosted runners it was written against.
            - name: Probe the runner for the tier-2 preconditions (never fails)
              run: |
                  set -uo pipefail
                  echo "--- cpu / memory ---"
                  nproc || true
                  free -h 2>/dev/null || true
                  echo "--- node / pnpm toolchain (this pilot's own addition) ---"
                  node --version || echo "node: ABSENT"
                  pnpm --version || echo "pnpm: ABSENT"
                  echo "--- docker daemon (gates any future container-backed job) ---"
                  if command -v docker >/dev/null 2>&1; then
                    docker version --format '{{.Server.Arch}} {{.Server.Version}}' || true
                    docker info --format '{{.OperatingSystem}} {{.Driver}}' || true
                  else
                    echo "docker: ABSENT -- container-backed jobs cannot move here"
                  fi
                  echo "--- toolchain the make targets need ---"
                  for tool in make git jq curl psql; do
                    printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo ABSENT)"
                  done

            # Cold-store install time on an ephemeral runner: every pool pod is
            # freshly provisioned, so there is no persistent pnpm store to warm --
            # unlike the hosted leg's actions/setup-node cache: pnpm, which this
            # attempt deliberately does not use, since a cache keyed to a pool that
            # discards its filesystem after one job buys nothing. Timed explicitly
            # so the pilot's PR body can carry this number.
            - name: Install dependencies (cold store; timed for the pilot report)
              run: |
                  set -euo pipefail
                  start="$(date +%s)"
                  pnpm install --frozen-lockfile
                  printf 'pnpm install --frozen-lockfile: %ss (cold store)\n' "$(( $(date +%s) - start ))"

            # The real work: the SAME `bash ci/run_checks.sh unit` invocation that
            # tests.yml's `unit` job runs -- deliberately the shared entry point
            # rather than a bare `pnpm test:unit`, so the two legs cannot drift
            # apart on flags or environment (run_checks.sh owns TZ/LANG/NODE_ENV).
            - name: Run unit tests on arm64
              run: bash ci/run_checks.sh unit
